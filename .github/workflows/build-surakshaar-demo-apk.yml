name: Build SurakshaAR Demo APK

on:
  push:
    branches:
      - demo/surakshaar-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: quick-demo-apk
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          test -f quick-demo-apk/app/build/outputs/apk/debug/app-debug.apk
          ls -lh quick-demo-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurakshaAR-Demo-APK
          path: quick-demo-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
